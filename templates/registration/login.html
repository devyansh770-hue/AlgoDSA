{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — AlgoDSA Workstation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 1rem;">
                <a href="{% url 'landing' %}" class="navbar-brand" style="justify-content: center; font-size: 1.5rem;">
                    <span class="logo-icon">⚡</span>
                    <span>AlgoDSA</span>
                </a>
            </div>

            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to your DSA learning workstation</p>

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}

                {% if form.errors %}
                <div class="message message-error" style="margin-bottom: 1rem; position: static;">
                    Invalid username or password. Please try again.
                </div>
                {% endif %}

                <div class="form-group">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" id="id_username" class="form-input"
                           placeholder="Enter your username" autocomplete="username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" id="id_password" class="form-input"
                           placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <input type="hidden" name="next" value="{{ next }}">

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; justify-content: center;">
                    Sign In →
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account yet? <a href="{% url 'register' %}">Create account →</a>
            </div>
        </div>
    </div>
</body>
</html>
